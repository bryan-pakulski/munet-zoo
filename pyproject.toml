[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "munet-zoo"
version = "0.1.0"
description = "Models built with MuNet: architectures, training and inference code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["munet-nn>=0.11", "numpy"]

[project.optional-dependencies]
data = ["Pillow>=10"]
eval = ["Pillow>=10", "pycocotools>=2.0.7"]
test = ["pytest", "torch", "torchvision", "scipy", "timm"]

[tool.setuptools.packages.find]
include = ["munet_zoo*"]

[tool.setuptools.package-data]
munet_zoo = ["rtdetrv2/LICENSE-RT-DETR"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
